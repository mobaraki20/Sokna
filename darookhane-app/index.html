  <header><div class="top"><div class="logo">⚕</div><div class="brand">داروخانهٔ مجازی<small>بیمارستان امیرالمؤمنین</small></div><div class="grow"></div><button class="iconbtn" id="searchBtn" aria-label="جستجو">⌕</button></div><nav class="nav"><button class="navbtn on" data-page="home">قفسهٔ آموزش</button><button class="navbtn" data-page="progress">پیشرفت من</button><button class="navbtn" data-page="about">راهنما</button></nav></header>

  <script>
  'use strict';
  const lessons=[
    {id:'bp',title:'فشار خون از صفر تا صد',subject:'فشار خون',level:'متوسط',color:'#7A2E1E',desc:'از فیزیولوژی و اندازه‌گیری صحیح تا خانواده‌های دارویی و ترکیب‌ها؛ با رمزهای ماندگار و کیس‌های واقعی پشت پیشخوان.',sections:[
      {t:'مفهوم فشار خون؛ پمپ، حجم، لوله',c:`<p>قلب را مانند یک پمپ و رگ‌ها را مانند شلنگ‌های انعطاف‌پذیر تصور کنید. نیروی خون بر دیوارهٔ رگ همان <b>فشار خون شریانی</b> است.</p><blockquote><b>رمز ماندگار:</b> پمپ، حجم، لوله؛ یعنی قدرت قلب، مقدار خون و مقاومت عروق.</blockquote><h2>سیستول و دیاستول</h2><ul><li><b>سیستول:</b> فشار هنگام انقباض قلب.</li><li><b>دیاستول:</b> فشار باقی‌مانده هنگام استراحت و پرشدن قلب.</li></ul>`},
      {t:'فشار نبض، MAP و عوامل افزایش فشار',c:`<p><b>فشار نبض</b> اختلاف سیستولیک و دیاستولیک است. در ۱۲۰/۸۰ برابر ۴۰ می‌شود.</p><p><b>MAP</b> تقریباً برابر است با فشار دیاستولیک به‌علاوهٔ یک‌سوم فشار نبض.</p><h2>چهار عامل افزایش فشار</h2><ul><li>قلب بیش‌فعال</li><li>تنگ‌شدن رگ‌ها</li><li>افزایش آب و سدیم</li><li>کاهش انعطاف‌پذیری عروق</li></ul>`},
      {t:'بیماری خاموش و فشار ثانویه',c:`<p>فشار خون ممکن است سال‌ها بدون سردرد یا سرگیجه وجود داشته باشد؛ نبود علامت، فشار بالا را رد نمی‌کند.</p><blockquote><b>اولیه:</b> یک علت مشخص پیدا نیست. <b>ثانویه:</b> یک متهم پشت صحنه وجود دارد.</blockquote><p>بیماری کلیه، آپنهٔ خواب، اختلالات هورمونی و بعضی داروها مانند NSAIDها، ضداحتقان‌ها و کورتون‌ها از علل مهم‌اند.</p>`},
      {t:'اندازه‌گیری صحیح و خطاهای شایع',c:`<h2>قانون ۵–۳۰–۲–۱</h2><p>۵ دقیقه استراحت؛ ۳۰ دقیقه بدون کافئین، سیگار و ورزش؛ ۲ بار اندازه‌گیری؛ ۱ دقیقه فاصله.</p><ul><li>کمر تکیه داده و پاها روی زمین</li><li>بازو هم‌سطح قلب و کاف روی پوست</li><li>کاف متناسب با دور بازو</li></ul><blockquote>کاف کوچک برای بازوی بزرگ، عدد را کاذباً بالا نشان می‌دهد.</blockquote>`},
      {t:'ارجاع فوری و علائم خطر',c:`<p>فشار بالاتر از ۱۸۰/۱۲۰ همراه با درد قفسه سینه، تنگی نفس، اختلال تکلم، ضعف ناگهانی، کاهش دید، گیجی یا سردرد بسیار شدید می‌تواند اورژانسی باشد.</p><blockquote><b>هشدار:</b> بیمار نباید در داروخانه منتظر بماند؛ ارجاع فوری لازم است. پایین‌آوردن سریع فشار با داروی خودسرانه خطرناک است.</blockquote>`},
      {t:'پریل‌ها، سارتان‌ها و پایش',c:`<p>ACEIها مانند کاپتوپریل و انالاپریل تولید آنژیوتانسین II را کم می‌کنند و ممکن است سرفهٔ خشک و پتاسیم بالا بدهند. ARBها مانند لوزارتان گیرندهٔ AT₁ را می‌بندند و کمتر سرفه می‌دهند.</p><blockquote>ACEI/ARB + دیورتیک + NSAID = سه‌گانهٔ آسیب کلیه.</blockquote><p>بارداری، آنژیوادم، کراتینین و پتاسیم از نکات حیاتی بررسی‌اند.</p>`},
      {t:'CCB، دیورتیک و بتابلاکر',c:`<p>آملودیپین بیشتر رگ را باز می‌کند و می‌تواند ورم مچ بدهد. وراپامیل و دیلتیازم نبض را کم می‌کنند. تیازید و فوروزماید آب و پتاسیم را بیرون می‌برند؛ اسپیرونولاکتون پتاسیم را نگه می‌دارد.</p><blockquote>بتابلاکر را ناگهانی قطع نکنید؛ وراپامیل/دیلتیازم همراه بتابلاکر می‌تواند دو ترمز روی یک قلب باشد.</blockquote>`}
    ],quiz:[
      {q:'رمز «پمپ، حجم، لوله» به چه اشاره دارد؟',o:['قلب، حجم خون و مقاومت عروق','قلب، ریه و کبد','سدیم، پتاسیم و کلسیم','سن، وزن و وراثت'],a:0,e:'پمپ یعنی قلب، حجم یعنی خون و مایع گردش، لوله یعنی مقاومت و انعطاف عروق.'},
      {q:'قانون ۵–۳۰–۲–۱ مربوط به چیست؟',o:['دوز دارو','اندازه‌گیری صحیح فشار','سطح ارجاع','آزمون کلیه'],a:1,e:'۵ دقیقه استراحت؛ ۳۰ دقیقه پرهیز؛ دو اندازه‌گیری؛ یک دقیقه فاصله.'},
      {q:'کدام ترکیب سه‌گانهٔ آسیب کلیه است؟',o:['بتابلاکر+استاتین+آسپرین','ACEI/ARB+دیورتیک+NSAID','آملودیپین+ویتامین D','نیترات+پنتوپرازول'],a:1,e:'کم‌شدن حجم و تغییر ورودی و خروجی فیلتر کلیه خطر آسیب حاد را بالا می‌برد.'}
    ]},
    {id:'hf',title:'نارسایی قلبی و داروهای قلب',subject:'نارسایی قلبی',level:'پیشرفته',color:'#31506B',desc:'از پمپ کم‌توان و کلیهٔ گول‌خورده تا چهار ستون درمان، ARNI، گلیفلوزین‌ها، MRA و دیورتیک‌های حلقه‌ای.',sections:[
      {t:'پمپ کم‌توان، پس‌زدگی و کلیهٔ گول‌خورده',c:`<p>نارسایی قلبی یعنی قلب هنوز می‌زند اما پمپاژ یا پرشدن آن کافی نیست. خون پشت قلب جمع می‌شود و کلیه با دریافت خون کمتر، اشتباهاً آب و نمک نگه می‌دارد.</p><blockquote>خرابی چپ: آب در ریه؛ خرابی راست: آب در پا و شکم.</blockquote>`},
      {t:'EF و چهار ستون درمان',c:`<p>EF درصد خونی است که بطن در هر ضربه بیرون می‌فرستد؛ درصد سلامت کل قلب نیست. EF طبیعی نارسایی را رد نمی‌کند.</p><h2>چهار ستون HFrEF</h2><ul><li>ARNI یا ACEI/ARB</li><li>بتابلاکر مناسب</li><li>MRA</li><li>SGLT2 inhibitor</li></ul><blockquote>چهار ستون عمر قلب را نگه می‌دارند؛ قرص آب، حال بیمار را سبک می‌کند.</blockquote>`},
      {t:'ساکوبیتریل/والسارتان',c:`<p>ساکوبیتریل نپری‌لیزین را مهار می‌کند و والسارتان گیرندهٔ AT₁ را می‌بندد.</p><blockquote>پس از قطع ACEI حداقل ۳۶ ساعت تا شروع ARNI فاصله لازم است. ARNI جایگزین ACEI/ARB است، نه مکمل آن.</blockquote>`},
      {t:'گلیفلوزین‌ها؛ داپا و امپا',c:`<p>داپاگلیفلوزین و امپاگلیفلوزین در نارسایی قلبی حتی بدون دیابت کاربرد دارند. دوز قلبی رایج هر دو ۱۰ میلی‌گرم روزانه است.</p><blockquote>سه روز پیش از جراحی یا ناشتایی طولانی معمولاً متوقف می‌شوند. تهوع، درد شکم و تنفس عمیق می‌تواند علامت کتواسیدوز باشد.</blockquote>`},
      {t:'MRA و دیورتیک حلقه‌ای',c:`<p>اسپیرونولاکتون و اپلرنون پتاسیم را نگه می‌دارند؛ آزمایش پتاسیم و کلیه ضروری است. فوروزماید و تورسماید آب اضافی را دفع می‌کنند و ممکن است پتاسیم را پایین بیاورند.</p><blockquote>قلب ورم‌دار و کلیهٔ حساس، با بروفن رفیق نیست.</blockquote>`},
      {t:'علائم تشدید و ارجاع',c:`<p>افزایش سریع وزن، تنگ‌شدن کفش، افزایش بالش برای خواب، بیدارشدن با خفگی و کاهش ادرار نشانهٔ تشدید احتمالی‌اند.</p><blockquote><b>ارجاع فوری:</b> تنگی نفس در استراحت، درد سینه، خلط صورتی، کبودی لب، غش یا گیجی جدید.</blockquote>`}
    ],quiz:[
      {q:'چهار ستون درمان HFrEF کدام‌اند؟',o:['دیورتیک، دیگوکسین، نیترات، آسپرین','ARNI/ACEI/ARB، بتابلاکر مناسب، MRA، SGLT2','CCB، استاتین، آسپرین، PPI'],a:1,e:'این چهار گروه پایهٔ کاهش خطر در بیمار مناسب‌اند.'},
      {q:'فاصلهٔ ACEI تا ساکوبیتریل/والسارتان؟',o:['۱۲ ساعت','۲۴ ساعت','۳۶ ساعت','۷۲ ساعت'],a:2,e:'برای کاهش خطر آنژیوادم حداقل ۳۶ ساعت فاصله لازم است.'},
      {q:'گلیفلوزین در بیمار غیر دیابتی مبتلا به نارسایی قلبی؟',o:['همیشه اشتباه است','می‌تواند اندیکاسیون قلبی داشته باشد','فقط برای لاغری است','همیشه ممنوع است'],a:1,e:'فایدهٔ قلبی گلیفلوزین فقط وابسته به کاهش قند نیست.'}
    ]},
    {id:'cad',title:'بیماری کرونر و چربی خون',subject:'کرونر و دیس‌لیپیدمی',level:'پیشرفته',color:'#8A6D1F',desc:'آنژین و نیتروگلیسیرین، ضدپلاکت‌ها، استنت، ازتیمایب، فیبرات‌ها و امگا ۳ دارویی.',sections:[
      {t:'آنژین و نیتروگلیسیرین',c:`<p>آنژین یعنی قلب اکسیژن می‌خواهد ولی رگ تنگ پاسخ کافی نمی‌دهد. درد جدید، شدیدتر یا در استراحت می‌تواند ناپایدار و اورژانسی باشد.</p><blockquote>زیر زبان برای همین الان؛ آهسته‌رهش برای پیشگیری. یک نیترو؛ پنج دقیقه؛ درد باقی بود، ۱۱۵.</blockquote>`},
      {t:'تداخل خطرناک نیترات',c:`<p>نیتروگلیسیرین رگ را باز می‌کند و ممکن است سردرد و افت فشار بدهد.</p><blockquote><b>نیترات + داروی اختلال نعوظ = سقوط فشار.</b> زمان آخرین مصرف سیلدنافیل یا تادالافیل باید پرسیده شود.</blockquote>`},
      {t:'آسپرین، کلوپیدوگرل و DAPT',c:`<p>آسپرین مسیر ترومبوکسان و کلوپیدوگرل گیرندهٔ P2Y12 را مهار می‌کند. ترکیب دو ضدپلاکت بعد از استنت برای جلوگیری از لخته اهمیت دارد.</p><blockquote>کبودی مختصر یا برنامهٔ دندان‌پزشکی مجوز قطع خودسرانهٔ داروی استنت نیست.</blockquote>`},
      {t:'تیکاگرلور؛ تیک‌تاک صبح و شب',c:`<p>تیکاگرلور مهارکنندهٔ مستقیم و برگشت‌پذیر P2Y12 است و معمولاً روزی دو بار مصرف می‌شود. خونریزی و تنگی نفس از نکات مهم‌اند.</p><blockquote>تنگی نفس آزاردهنده نیز مجوز قطع خودسرانه پس از استنت نیست؛ ابتدا علل قلبی و ریوی خطرناک بررسی شوند.</blockquote>`},
      {t:'ازتیمایب و فیبرات‌ها',c:`<p>استاتین کارخانهٔ کبد را می‌بندد و ازتیمایب دروازهٔ جذب روده را. فیبرات‌ها بیشتر برای تری‌گلیسیرید بالا هستند.</p><blockquote>جم‌فیبروزیل را با استاتین جمع نکن؛ خطر میوپاتی و رابدومیولیز بیشتر می‌شود.</blockquote>`},
      {t:'امگا ۳ و ایکوزاپنت اتیل',c:`<p>۱۰۰۰ میلی‌گرم روغن ماهی لزوماً ۱۰۰۰ میلی‌گرم EPA+DHA نیست. ایکوزاپنت اتیل EPA خالص و فرآورده‌ای متفاوت است.</p><blockquote>دوز را از روی EPA و DHA حساب کنید، نه وزن کل روغن ماهی. خونریزی و فیبریلاسیون دهلیزی باید پایش شوند.</blockquote>`}
    ],quiz:[
      {q:'سوستاک آهسته‌رهش برای چیست؟',o:['نجات فوری حمله','پیشگیری از حمله','کاهش چربی','کاهش قند'],a:1,e:'فرم زیرزبانی برای حمله و آهسته‌رهش برای پیشگیری است.'},
      {q:'قطع خودسرانهٔ ضدپلاکت بعد از استنت چه خطری دارد؟',o:['یبوست','لختهٔ داخل استنت و سکته','قند بالا','کاهش پتاسیم'],a:1,e:'مدت درمان را پزشک بر اساس نوع استنت و خطر خونریزی تعیین می‌کند.'},
      {q:'۱۰۰۰ میلی‌گرم روغن ماهی یعنی ۱۰۰۰ میلی‌گرم EPA؟',o:['بله','خیر، باید EPA و DHA واقعی خوانده شود','فقط در ایران بله','فقط در کودکان'],a:1,e:'عدد روی جلوی بسته ممکن است وزن کل روغن باشد.'}
    ]}
  ];
  const state=JSON.parse(localStorage.getItem('daruyar.pwa')||'{"read":{},"scores":[]}');let current=null,secIndex=0,quiz=null,deferredPrompt=null;
  const app=document.getElementById('app');const save=()=>localStorage.setItem('daruyar.pwa',JSON.stringify(state));
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function pct(l){const n=(state.read[l.id]||[]).length;return Math.round(n/l.sections.length*100)}
  function nav(name){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.page===name));if(name==='home')home();if(name==='progress')progress();if(name==='about')about();scrollTo(0,0)}
  function home(){const done=lessons.reduce((n,l)=>n+(state.read[l.id]||[]).length,0),total=lessons.reduce((n,l)=>n+l.sections.length,0);app.innerHTML=`<section class="hero"><div><small>سامانهٔ آموزشی داروخانه</small><h1>هوش‌نامهٔ دارویی</h1><p>مطالعهٔ مرحله‌به‌مرحله، مرور نکات پشت پیشخوان و آزمون تعاملی؛ قابل نصب و استفادهٔ آفلاین.</p></div><div class="stats"><div class="stat"><b>${lessons.length}</b><span>کتاب آموزشی</span></div><div class="stat"><b>${total}</b><span>درس کوتاه</span></div><div class="stat"><b>${done}</b><span>مطالعه‌شده</span></div><div class="stat"><b>${state.scores.length}</b><span>آزمون ثبت‌شده</span></div></div></section><div class="section-title"><h2>قفسهٔ آموزش</h2></div><section class="grid">${lessons.map(l=>`<article class="book"><div class="cover" style="background:linear-gradient(135deg,${l.color},#172d27)"><small>${esc(l.subject)} · سطح ${esc(l.level)}</small><h3>${esc(l.title)}</h3></div><div class="meta"><span>${l.sections.length} درس</span><span>${pct(l)}٪ پیشرفت</span></div><div class="bar"><i style="width:${pct(l)}%"></i></div><button class="btn primary" onclick="openLesson('${l.id}',0)">مطالعهٔ کتاب</button></article>`).join('')}</section>`}
  window.openLesson=(id,i=0)=>{current=lessons.find(l=>l.id===id);secIndex=Math.max(0,Math.min(i,current.sections.length-1));reader()};
  function reader(){const s=current.sections[secIndex],read=(state.read[current.id]||[]).includes(secIndex);app.innerHTML=`<div class="reader-head"><button class="btn" onclick="nav('home')">بازگشت</button><b>${esc(current.title)}</b><span class="grow"></span><button class="btn" onclick="startQuiz('${current.id}')">آزمون کتاب</button></div><article class="reader"><div class="over">درس ${secIndex+1} از ${current.sections.length}</div><h1>${esc(s.t)}</h1>${s.c}<label class="done"><input type="checkbox" ${read?'checked':''} onchange="toggleRead(this.checked)"><b>این درس را خواندم</b></label></article><div class="reader-nav"><button class="btn" ${secIndex===0?'disabled':''} onclick="openLesson('${current.id}',${secIndex-1})">درس قبل</button><button class="btn primary" ${secIndex===current.sections.length-1?'disabled':''} onclick="openLesson('${current.id}',${secIndex+1})">درس بعد</button></div>`;scrollTo(0,0)}
  window.toggleRead=checked=>{state.read[current.id]=state.read[current.id]||[];if(checked&&!state.read[current.id].includes(secIndex))state.read[current.id].push(secIndex);if(!checked)state.read[current.id]=state.read[current.id].filter(x=>x!==secIndex);save();toast(checked?'درس ثبت شد':'علامت مطالعه حذف شد')};
  window.startQuiz=id=>{const l=lessons.find(x=>x.id===id);quiz={l,idx:0,score:0,locked:false};quizView()};
  function quizView(){const q=quiz.l.quiz[quiz.idx];app.innerHTML=`<section class="quiz"><div class="qtop"><span>آزمون «${esc(quiz.l.title)}»</span><span>سؤال ${quiz.idx+1} از ${quiz.l.quiz.length}</span></div><div class="bar" style="margin-bottom:18px"><i style="width:${quiz.idx/quiz.l.quiz.length*100}%"></i></div><div class="qcard"><div class="question">${esc(q.q)}</div><div class="options">${q.o.map((o,i)=>`<button class="option" onclick="answer(${i})">${['الف','ب','ج','د'][i]}. ${esc(o)}</button>`).join('')}</div><div id="feed"></div></div></section>`;scrollTo(0,0)}
  window.answer=i=>{if(quiz.locked)return;quiz.locked=true;const q=quiz.l.quiz[quiz.idx],buttons=[...document.querySelectorAll('.option')];buttons[q.a].classList.add('correct');if(i!==q.a)buttons[i].classList.add('wrong');else quiz.score++;document.getElementById('feed').innerHTML=`<div class="feedback"><b>${i===q.a?'پاسخ درست':'پاسخ نادرست'}</b><br>${esc(q.e)}</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="nextQuestion()">${quiz.idx===quiz.l.quiz.length-1?'نتیجهٔ آزمون':'سؤال بعدی'}</button>`}
  window.nextQuestion=()=>{if(quiz.idx<quiz.l.quiz.length-1){quiz.idx++;quiz.locked=false;quizView()}else{const p=Math.round(quiz.score/quiz.l.quiz.length*100);state.scores.push({id:quiz.l.id,title:quiz.l.title,score:quiz.score,total:quiz.l.quiz.length,pct:p,date:Date.now()});save();app.innerHTML=`<section class="quiz"><div class="qcard" style="text-align:center"><div style="font-size:58px;color:var(--green);font-weight:900">${p}٪</div><h2>نتیجهٔ آزمون</h2><p>${quiz.score} پاسخ درست از ${quiz.l.quiz.length} سؤال</p><button class="btn primary" onclick="startQuiz('${quiz.l.id}')">تکرار آزمون</button> <button class="btn" onclick="nav('home')">بازگشت به قفسه</button></div></section>`}}
  function progress(){app.innerHTML=`<div class="section-title"><h2>پیشرفت من</h2></div><div class="progress-list">${lessons.map(l=>`<div class="prow"><div><b>${esc(l.title)}</b><small>${(state.read[l.id]||[]).length} از ${l.sections.length} درس خوانده شده</small><div class="bar" style="margin-top:9px"><i style="width:${pct(l)}%"></i></div></div><b>${pct(l)}٪</b></div>`).join('')}</div><div class="section-title"><h2>نتایج آزمون‌ها</h2></div><div class="panel">${state.scores.length?state.scores.slice().reverse().map(x=>`<div class="result"><b>${esc(x.title)}</b><small>${x.score} از ${x.total} — ${x.pct}٪ · ${new Date(x.date).toLocaleDateString('fa-IR')}</small></div>`).join(''):'<div class="empty">هنوز آزمونی ثبت نشده است.</div>'}</div>`}
  function about(){app.innerHTML=`<div class="section-title"><h2>راهنمای وب‌اپلیکیشن</h2></div><div class="panel"><h2>نصب روی گوشی</h2><p>در اندروید، دکمهٔ «نصب» یا گزینهٔ Add to Home Screen مرورگر را بزنید. در آیفون، از منوی Share گزینهٔ Add to Home Screen را انتخاب کنید.</p><h2>ذخیرهٔ اطلاعات</h2><p>پیشرفت مطالعه و نتیجهٔ آزمون‌ها روی همان دستگاه ذخیره می‌شوند. پاک‌کردن داده‌های مرورگر باعث حذف آن‌ها می‌شود.</p><h2>تذکر پزشکی</h2><p>این برنامه برای آموزش حرفه‌ای است و جایگزین ارزیابی پزشک، داروساز مسئول یا دستور نسخه نیست.</p><button class="btn danger" onclick="resetData()">پاک‌کردن پیشرفت‌ها</button></div>`}
  window.resetData=()=>{if(confirm('تمام پیشرفت‌ها و نتایج آزمون حذف شود؟')){localStorage.removeItem('daruyar.pwa');state.read={};state.scores=[];progress();toast('اطلاعات پاک شد')}};
  function search(){app.innerHTML=`<div class="section-title"><h2>جستجو در آموزش‌ها</h2></div><div class="panel"><input class="search" id="q" placeholder="مثلاً کاپتوپریل، استنت یا فوروزماید..." autofocus><div id="results"></div></div>`;const q=document.getElementById('q');q.oninput=()=>{const v=q.value.trim().toLowerCase(),r=[];if(v.length>1)lessons.forEach(l=>l.sections.forEach((s,i)=>{const text=(l.title+' '+s.t+' '+s.c.replace(/<[^>]+>/g,' ')).toLowerCase();if(text.includes(v))r.push({l,s,i})}));document.getElementById('results').innerHTML=v.length<2?'<div class="empty">حداقل دو حرف بنویسید.</div>':r.length?r.map(x=>`<div class="result" onclick="openLesson('${x.l.id}',${x.i})"><b>${esc(x.s.t)}</b><small>${esc(x.l.title)}</small></div>`).join(''):'<div class="empty">نتیجه‌ای پیدا نشد.</div>'};q.focus()}
  function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
  document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.getElementById('searchBtn').onclick=search;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBox').classList.add('show')});
  document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBox').classList.remove('show')};document.getElementById('installClose').onclick=()=>document.getElementById('installBox').classList.remove('show');
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
  </script>
</body>
</html>
